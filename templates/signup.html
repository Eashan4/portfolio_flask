{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center py-5">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
        <h3 class="text-center fw-bold mb-4">Create Account</h3>
        <form method="POST" action="/signup">
            <div class="mb-3"><label>Name</label><input type="text" name="name" required class="form-control"></div>
            <div class="mb-3"><label>Email</label><input type="email" name="email" required class="form-control"></div>
            <div class="mb-3"><label>Password</label><input type="password" name="password" required class="form-control"></div>
            <div class="mb-3"><label>Confirm Password</label><input type="password" name="confirm" required class="form-control"></div>
            <button type="submit" class="btn btn-success w-100">Sign Up</button>
            <p class="text-center mt-3">Already have an account? <a href="/login">Login</a></p>
        </form>
    </div>
</div>
{% endblock %}
