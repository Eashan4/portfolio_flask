{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center py-5">
    <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
        <h3 class="text-center fw-bold mb-4">Login</h3>
        <form method="POST" action="/login">
            <div class="mb-3"><label>Email</label><input type="email" name="email" required class="form-control"></div>
            <div class="mb-3"><label>Password</label><input type="password" name="password" required class="form-control"></div>
            <div class="form-check mb-3"><input type="checkbox" class="form-check-input" id="remember"><label for="remember" class="form-check-label">Remember Me</label></div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <p class="text-center mt-3">Don't have an account? <a href="/signup">Sign Up</a></p>
        </form>
    </div>
</div>
{% endblock %}
