{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <h1 class="fw-bold text-center mb-4">Contact Me</h1>
    <p class="text-muted text-center">Feel free to reach out for collaborations or queries.</p>
    <hr class="w-25 mx-auto mb-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <form method="POST" action="/contact">
                    <div class="mb-3"><label>Name</label><input class="form-control" name="name" required></div>
                    <div class="mb-3"><label>Email</label><input class="form-control" type="email" name="email" required></div>
                    <div class="mb-3"><label>Message</label><textarea class="form-control" name="message" required></textarea></div>
                    <button class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
